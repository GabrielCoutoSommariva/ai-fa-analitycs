server {
  listen 80;
  server_name dash.farmaciasassociadas.com.br;

  client_max_body_size 20m;
  access_log off;

  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name dash.farmaciasassociadas.com.br;

  ssl_certificate /etc/letsencrypt/live/dash.farmaciasassociadas.com.br/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/dash.farmaciasassociadas.com.br/privkey.pem;

  client_max_body_size 20m;
  access_log off;

  location /api/ {
    proxy_pass http://backend:8000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location / {
    proxy_pass http://frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
